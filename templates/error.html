{% extends "layout.html" %}

{% block content %}
<div class="container text-center mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow-lg">
                <div class="card-body">
                    <h1 class="display-1 text-danger">Oops!</h1>
                    <h2 class="mb-4">Something went wrong</h2>
                    <p class="lead">We encountered an unexpected error. Please try again later.</p>
                    
                    {% if error %}
                        <div class="alert alert-danger mt-4">
                            <h5 class="alert-heading">Error Details:</h5>
                            <p>{{ error }}</p>
                        </div>
                    {% endif %}

                    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg mt-4">
                        <i class="fas fa-home me-2"></i>
                        Go to Homepage
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
